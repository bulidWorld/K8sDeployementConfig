    \ NotReady for at least onPodNotReadyThreshold:\n        #   none (default) —\
    \ do nothing\n        #   retry          — re-enqueue the CHI so the stuck host\
    \ is force-restarted\n        # OFF by default: force-recreating a Completed CHI's\
    \ pod is destructive — it can\n        # interrupt a replica's in-progress recovery\
    \ and means hard downtime for a\n        # single-replica shard. Opt in with `retry`\
