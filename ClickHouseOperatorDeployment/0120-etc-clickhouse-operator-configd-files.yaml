apiVersion: v1
kind: ConfigMap
metadata:
  name: etc-clickhouse-operator-configd-files
  namespace: clickhouse
  labels:
    clickhouse.altinity.com/chop: 0.27.4
    app: clickhouse-operator
data:
  01-clickhouse-01-listen.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n    <!-- Listen wildcard address to allow\
    \ accepting connections from other containers and host network. -->\n    <listen_host>::</listen_host>\n\
    \    <listen_host>0.0.0.0</listen_host>\n    <listen_try>1</listen_try>\n</yandex>\n"
  01-clickhouse-02-logger.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n    <logger>\n        <!-- Possible levels:\
    \ https://github.com/pocoproject/poco/blob/devel/Foundation/include/Poco/Logger.h#L439\
    \ -->\n        <level>debug</level>\n        <log>/var/log/clickhouse-server/clickhouse-server.log</log>\n\
    \        <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>\n\
    \        <size>1000M</size>\n        <count>10</count>\n        <!-- Default behavior\
    \ is autodetection (log to console if not daemon mode and is tty) -->\n      \
    \  <console>1</console>\n    </logger>\n</yandex>\n"
  01-clickhouse-03-query_log.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n    <query_log replace=\"1\">\n        <database>system</database>\n\
    \        <table>query_log</table>\n        <engine>Engine = MergeTree PARTITION\
    \ BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>\n\
    \        <flush_interval_milliseconds>7500</flush_interval_milliseconds>\n   \
    \ </query_log>\n    <query_thread_log remove=\"1\"/>\n</yandex>\n"
  01-clickhouse-04-part_log.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n    <part_log replace=\"1\">\n        <database>system</database>\n\
    \        <table>part_log</table>\n        <engine>Engine = MergeTree PARTITION\
    \ BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>\n\
    \        <flush_interval_milliseconds>7500</flush_interval_milliseconds>\n   \
    \ </part_log>\n</yandex>\n"
  01-clickhouse-05-trace_log.xml: "<!-- IMPORTANT -->\n<!-- This file is auto-generated\
    \ -->\n<!-- Do not edit this file - all changes would be lost -->\n<!-- Edit appropriate\
    \ template in the following folder: -->\n<!-- deploy/builder/templates-config\
    \ -->\n<!-- IMPORTANT -->\n<yandex>\n    <trace_log replace=\"1\">\n        <database>system</database>\n\
    \        <table>trace_log</table>\n        <engine>Engine = MergeTree PARTITION\
    \ BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>\n\
    \        <flush_interval_milliseconds>7500</flush_interval_milliseconds>\n   \
    \ </trace_log>\n</yandex>\n"
