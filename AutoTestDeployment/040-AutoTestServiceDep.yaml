apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-test-service
  namespace: auto-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-test-service
  template:
    metadata:
      labels:
        app: auto-test-service
    spec:
      containers:
        - name: backend
          # 部署前替换镜像地址，并创建数据库配置 ConfigMap 和密码 Secret。
          image: lingxi.image.io/kunpeng/auto-test/auto-test-service:v0.002
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: auto-test-service-config
          volumeMounts:
            - name: auto-test-service-storage
              mountPath: /var/service/auto-test-service
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: auto-test-service-storage
          persistentVolumeClaim:
            claimName: auto-test-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: auto-test-service
  namespace: auto-test-app
spec:
  type: ClusterIP
  selector:
    app: auto-test-service
  ports:
    - name: http
      port: 80
      targetPort: http
