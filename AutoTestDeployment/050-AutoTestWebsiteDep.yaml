apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotest-frontend
  namespace: auto-test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autotest-frontend
  template:
    metadata:
      labels:
        app: autotest-frontend
    spec:
      containers:
        - name: frontend
          # 部署前替换为实际镜像仓库和版本。
          image: lingxi.image.io/kunpeng/auto-test/auto-test-website:v0.006
          env:
            - name: BACKEND_UPSTREAM
              value: "http://auto-test-service.auto-test-app.svc.cluster.local"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 180
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: autotest-frontend
  namespace: auto-test-app
spec:
  type: NodePort
  selector:
    app: autotest-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30111
