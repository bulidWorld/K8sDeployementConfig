apiVersion: v1
kind: Secret
metadata:
  name: pg-auto-test-service-auth
  namespace: database
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: autotestservice
  # 部署前请替换为实际使用的强密码。
  password: "Changeme_123"
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pg-ha-auto-test-service
  namespace: database
spec:
  cluster:
    name: pg-ha
  name: autotestservice
  login: true
  passwordSecret:
    name: pg-auto-test-service-auth
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pg-ha-auto-test-service-db
  namespace: database
spec:
  cluster:
    name: pg-ha
  name: autotestservice-db
  owner: autotestservice
  databaseReclaimPolicy: retain
