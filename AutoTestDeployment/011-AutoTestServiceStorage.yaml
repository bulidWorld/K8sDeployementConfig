apiVersion: v1
kind: PersistentVolume
metadata:
  name: auto-test-service-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pg-local
  local:
    path: /var/service/auto-test-service
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auto-test-service-pvc
  namespace: auto-test-app
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
  storageClassName: pg-local
  volumeName: auto-test-service-pv
