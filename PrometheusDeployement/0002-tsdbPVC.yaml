apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-tsdb-worker-01
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pg-local
  local:
    path: /data/prometheus-tsdb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: prometheus-worker
              operator: In
              values:
                - prime